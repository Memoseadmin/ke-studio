<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>$css</style></head><body>
<div class="card last">
  <header class="top"><span class="pageno"><b data-font>$num</b><span class="slash" data-font>/ $total</span></span><span class="brand" data-font><i class="seal-mark"></i>$brand</span></header>
  $plate
  <h2 class="cta" data-check="CTA" data-maxlines="2" data-font>$headline</h2>
  <div class="rule"></div>
  <section class="sources">
    <p class="src" data-check="출처 줄" data-maxlines="3" data-font>$body</p>
    $credit
  </section>
  <p class="ai" data-check="AI 고지" data-maxlines="1" data-font>$ai</p>
  <footer class="foot"><span class="handle" data-font>$handle</span></footer>
  $mockup
</div></body></html>
